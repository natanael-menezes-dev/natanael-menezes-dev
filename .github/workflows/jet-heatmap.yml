name: Update jet heatmap SVG

on:
  # Roda no primeiro envio (e sempre que o gerador ou o workflow mudarem),
  # para que a animação seja criada automaticamente sem clicar em "Run workflow".
  push:
    branches: [main]
    paths:
      - "generate.mjs"
      - ".github/workflows/jet-heatmap.yml"
  schedule:
    # Roda uma vez por dia, 05:30 UTC (~02:30 no horário de Brasília).
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVG
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: dist/github-jet.svg
        run: node generate.mjs

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update jet heatmap SVG"
          file_pattern: dist/github-jet.svg
